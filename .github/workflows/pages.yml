name: Pages

# Builds the live dashboard in site/ from the committed level-*/ results, task files,
# eval_suite.py, README.md and REPORT.md, and publishes it to GitHub Pages at the site root.
# npm run build first runs site/src/engine.check.mjs, so the deploy fails if the
# in-browser replay disagrees with any recorded number.
# The Pages source is "GitHub Actions"; the legacy docs/index.md summary was removed on
# 2026-11-08 (its numbers live in REPORT.md).
on:
  push:
    branches: [main]
    paths: ['site/**', 'level-1-learn/**', 'level-2-build/**', 'level-3-deep/**', 'README.md', 'REPORT.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
